version: 2
updates:
  # Frontend (repo root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native (tsgo) compiler; svelte-check / typescript-eslint
      # still need the dual-install + --tsgo setup. Revisit as a deliberate migration.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # One PR per week for all non-breaking bumps; majors still come individually.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Azure Functions API
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the deploy workflows. First-party actions
  # (checkout, setup-node, deploy-pages…) — group every update, majors included,
  # into a single weekly PR so they don't arrive one at a time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
